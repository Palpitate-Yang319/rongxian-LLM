<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>智能AI助手 | 真正的大模型对话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      max-height: 850px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
    }

    /* 头部 */
    .app-header {
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-icon {
      font-size: 2rem;
      background: rgba(255, 255, 255, 0.2);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .model-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(10px);
    }

    /* 设置面板 */
    .settings-panel {
      padding: 1rem 2rem;
      background: #f8f9ff;
      border-bottom: 1px solid #e8ecf1;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-key-input {
      flex: 1;
      min-width: 200px;
      padding: 0.6rem 1rem;
      border: 2px solid #e0e4f0;
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .api-key-input:focus {
      border-color: #667eea;
    }

    .provider-select {
      padding: 0.6rem 1rem;
      border: 2px solid #e0e4f0;
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      background: white;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .save-btn {
      padding: 0.6rem 1.5rem;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .save-btn:hover {
      background: #5a67d8;
      transform: translateY(-1px);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #48bb78;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #48bb78;
    }

    /* 聊天区域 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: #fafbff;
    }

    .message-row {
      display: flex;
      gap: 1rem;
      animation: slideIn 0.3s ease-out;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .assistant .avatar {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .user .avatar {
      background: #48bb78;
      color: white;
    }

    .bubble {
      max-width: 75%;
      padding: 1rem 1.3rem;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .assistant .bubble {
      background: white;
      color: #2d3748;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      border-bottom-left-radius: 6px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      border-bottom-right-radius: 6px;
    }

    .typing-indicator {
      display: flex;
      gap: 0.3rem;
      padding: 0.5rem 0;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a0aec0;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-10px); opacity: 1; }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 输入区域 */
    .input-area {
      padding: 1.5rem 2rem;
      background: white;
      border-top: 1px solid #e8ecf1;
    }

    .input-wrapper {
      display: flex;
      gap: 1rem;
      align-items: flex-end;
      background: #f8f9ff;
      border-radius: 16px;
      padding: 0.8rem;
      border: 2px solid #e8ecf1;
      transition: border-color 0.3s;
    }

    .input-wrapper:focus-within {
      border-color: #667eea;
    }

    #userInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      resize: none;
      max-height: 120px;
      padding: 0.5rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    .send-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .clear-btn {
      background: #f0f0f0;
      color: #666;
    }

    .clear-btn:hover {
      background: #e0e0e0;
    }

    .safety-note {
      text-align: center;
      font-size: 0.75rem;
      color: #a0aec0;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .app-container {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .bubble {
        max-width: 85%;
      }
      .settings-panel {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 头部 -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fas fa-brain"></i>
        </div>
        <div class="logo-text">智能AI助手</div>
      </div>
      <div class="model-badge">
        <i class="fas fa-shield-alt"></i>
        <span>安全对话模式</span>
      </div>
    </header>

    <!-- API设置面板 -->
    <div class="settings-panel" id="settingsPanel">
      <select class="provider-select" id="providerSelect">
        <option value="deepseek">DeepSeek (推荐)</option>
        <option value="openai">OpenAI (GPT-3.5/4)</option>
        <option value="custom">自定义API</option>
      </select>
      <input 
        type="password" 
        class="api-key-input" 
        id="apiKeyInput" 
        placeholder="输入您的API密钥 (仅在本地存储，不上传)"
      />
      <button class="save-btn" id="saveApiKeyBtn">
        <i class="fas fa-key"></i> 保存密钥
      </button>
      <div class="status-indicator" id="connectionStatus">
        <span class="status-dot"></span>
        <span>就绪</span>
      </div>
    </div>

    <!-- 聊天消息 -->
    <div class="chat-messages" id="chatMessages">
      <div class="message-row assistant">
        <div class="avatar">
          <i class="fas fa-robot"></i>
        </div>
        <div class="bubble">
          你好！我是真正的AI助手 🤖<br><br>
          我基于大语言模型，可以进行智能对话、回答问题、创意写作等各种任务。<br><br>
          <strong>开始使用：</strong><br>
          1. 在顶部输入您的API密钥（支持DeepSeek、OpenAI等）<br>
          2. 密钥仅保存在您的浏览器本地存储中<br>
          3. 开始智能对话吧！<br><br>
          <em>💡 提示：DeepSeek目前提供免费额度，注册即可获取API密钥</em>
        </div>
      </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea 
          id="userInput" 
          placeholder="输入您的问题... (Enter发送，Shift+Enter换行)" 
          rows="1"
        ></textarea>
        <div class="action-buttons">
          <button class="icon-btn clear-btn" id="clearChatBtn" title="清空对话">
            <i class="fas fa-trash-alt"></i>
          </button>
          <button class="icon-btn send-btn" id="sendBtn" title="发送消息">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
      <div class="safety-note">
        <i class="fas fa-lock"></i>
        端到端加密 · API密钥本地存储 · 内容安全过滤
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============ 安全配置 ============
      const SAFETY_RULES = {
        maxInputLength: 4000,
        blockedPatterns: [
          /delete\s+from|drop\s+table|exec\s*\(|eval\s*\(/gi,
          /<script|javascript:|onerror=|onclick=/gi,
          /system\s*\(|passthru\s*\(|shell_exec\s*\(/gi,
        ],
        sensitiveKeywords: ['自杀', '自残', '制造炸弹', '黑客攻击', '非法入侵'],
      };

      // 安全过滤函数
      function safetyFilter(input) {
        let cleaned = input.trim();
        
        // 长度限制
        if (cleaned.length > SAFETY_RULES.maxInputLength) {
          cleaned = cleaned.substring(0, SAFETY_RULES.maxInputLength);
        }
        
        // 检查危险模式
        for (let pattern of SAFETY_RULES.blockedPatterns) {
          if (pattern.test(cleaned)) {
            return { safe: false, message: '检测到潜在危险代码，已阻止发送' };
          }
        }
        
        // 检查敏感词
        for (let keyword of SAFETY_RULES.sensitiveKeywords) {
          if (cleaned.includes(keyword)) {
            return { safe: false, message: '请保持友善对话，避免敏感内容' };
          }
        }
        
        // 转义HTML（防XSS）
        cleaned = cleaned
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
        
        return { safe: true, cleaned };
      }

      // ============ API 配置 ============
      const API_CONFIGS = {
        deepseek: {
          url: 'https://api.deepseek.com/v1/chat/completions',
          model: 'deepseek-chat',
          headers: (apiKey) => ({
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          })
        },
        openai: {
          url: 'https://api.openai.com/v1/chat/completions',
          model: 'gpt-3.5-turbo',
          headers: (apiKey) => ({
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          })
        },
        custom: {
          url: localStorage.getItem('custom_api_url') || '',
          model: 'default',
          headers: (apiKey) => ({
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          })
        }
      };

      // ============ 状态管理 ============
      let conversationHistory = [];
      let currentApiKey = localStorage.getItem('ai_api_key') || '';
      let currentProvider = localStorage.getItem('ai_provider') || 'deepseek';
      
      // ============ UI 元素 ============
      const chatMessages = document.getElementById('chatMessages');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const clearChatBtn = document.getElementById('clearChatBtn');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const providerSelect = document.getElementById('providerSelect');
      const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
      const connectionStatus = document.getElementById('connectionStatus');

      // 初始化
      function init() {
        apiKeyInput.value = currentApiKey;
        providerSelect.value = currentProvider;
        updateConnectionStatus();
        loadConversation();
      }

      // 更新连接状态
      function updateConnectionStatus() {
        const statusDot = connectionStatus.querySelector('.status-dot');
        const statusText = connectionStatus.querySelector('span:last-child');
        
        if (currentApiKey) {
          statusDot.style.background = '#48bb78';
          statusText.textContent = '已配置密钥';
          connectionStatus.style.color = '#48bb78';
        } else {
          statusDot.style.background = '#f56565';
          statusText.textContent = '未配置密钥';
          connectionStatus.style.color = '#f56565';
        }
      }

      // 保存API密钥
      function saveApiKey() {
        const key = apiKeyInput.value.trim();
        const provider = providerSelect.value;
        
        if (key) {
          localStorage.setItem('ai_api_key', key);
          localStorage.setItem('ai_provider', provider);
          currentApiKey = key;
          currentProvider = provider;
          updateConnectionStatus();
          addSystemMessage('✅ API密钥已保存，可以开始智能对话了！');
        } else {
          addSystemMessage('⚠️ 请输入有效的API密钥');
        }
      }

      // 添加系统消息
      function addSystemMessage(content) {
        const row = document.createElement('div');
        row.className = 'message-row assistant';
        row.innerHTML = `
          <div class="avatar"><i class="fas fa-info-circle"></i></div>
          <div class="bubble" style="background: #f0f4ff; color: #667eea;">${content}</div>
        `;
        chatMessages.appendChild(row);
        scrollToBottom();
      }

      // 添加消息
      function addMessage(role, content) {
        const row = document.createElement('div');
        row.className = `message-row ${role}`;
        
        const avatarIcon = role === 'user' ? 'fa-user' : 'fa-robot';
        row.innerHTML = `
          <div class="avatar"><i class="fas ${avatarIcon}"></i></div>
          <div class="bubble">${content.replace(/\n/g, '<br>')}</div>
        `;
        
        chatMessages.appendChild(row);
        scrollToBottom();
      }

      // 显示打字动画
      function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message-row assistant';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
          <div class="avatar"><i class="fas fa-robot"></i></div>
          <div class="bubble">
            <div class="typing-indicator">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>
        `;
        chatMessages.appendChild(typingDiv);
        scrollToBottom();
      }

      // 移除打字动画
      function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
      }

      // 调用真实API
      async function callAIAPI(userMessage) {
        if (!currentApiKey) {
          addSystemMessage('⚠️ 请先配置API密钥才能使用智能对话功能');
          return null;
        }

        const config = API_CONFIGS[currentProvider];
        if (!config || !config.url) {
          addSystemMessage('⚠️ API配置错误，请检查设置');
          return null;
        }

        // 构建消息历史
        const messages = [
          {
            role: 'system',
            content: '你是一个智能AI助手，请用中文回答用户问题。回答要详细、有帮助、友好。如果用户问危险或非法问题，请礼貌拒绝。'
          },
          ...conversationHistory.slice(-10), // 保留最近10轮对话
          { role: 'user', content: userMessage }
        ];

        try {
          const response = await fetch(config.url, {
            method: 'POST',
            headers: config.headers(currentApiKey),
            body: JSON.stringify({
              model: config.model,
              messages: messages,
              temperature: 0.7,
              max_tokens: 2000,
              stream: false
            })
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error?.message || `API请求失败 (${response.status})`);
          }

          const data = await response.json();
          const aiResponse = data.choices[0]?.message?.content || '抱歉，我没有得到有效的回复';
          
          // 更新对话历史
          conversationHistory.push(
            { role: 'user', content: userMessage },
            { role: 'assistant', content: aiResponse }
          );
          
          // 保存对话历史
          saveConversation();
          
          return aiResponse;
        } catch (error) {
          console.error('API调用错误:', error);
          throw error;
        }
      }

      // 处理发送消息
      async function handleSendMessage() {
        const rawInput = userInput.value;
        if (!rawInput.trim()) return;

        // 安全检查
        const safetyResult = safetyFilter(rawInput);
        if (!safetyResult.safe) {
          addSystemMessage(`🛡️ ${safetyResult.message}`);
          userInput.value = '';
          return;
        }

        const userMessage = safetyResult.cleaned;
        
        // 显示用户消息
        addMessage('user', userMessage);
        userInput.value = '';
        userInput.style.height = 'auto';
        
        // 检查API密钥
        if (!currentApiKey) {
          addSystemMessage('⚠️ 请先配置API密钥。推荐使用DeepSeek，注册即送免费额度！');
          return;
        }

        // 显示打字动画
        showTypingIndicator();
        sendBtn.disabled = true;

        try {
          const aiResponse = await callAIAPI(userMessage);
          removeTypingIndicator();
          
          if (aiResponse) {
            addMessage('assistant', aiResponse);
          }
        } catch (error) {
          removeTypingIndicator();
          addSystemMessage(`❌ 错误: ${error.message || '调用AI失败，请检查API密钥和网络连接'}`);
        } finally {
          sendBtn.disabled = false;
          userInput.focus();
        }
      }

      // 保存对话历史
      function saveConversation() {
        try {
          // 只保存最近20条消息以节省空间
          const recentHistory = conversationHistory.slice(-20);
          localStorage.setItem('ai_conversation', JSON.stringify(recentHistory));
        } catch (e) {
          console.warn('对话历史保存失败:', e);
        }
      }

      // 加载对话历史
      function loadConversation() {
        try {
          const saved = localStorage.getItem('ai_conversation');
          if (saved) {
            conversationHistory = JSON.parse(saved);
            // 显示最近的对话
            const recentMessages = conversationHistory.slice(-6);
            recentMessages.forEach(msg => {
              if (msg.role === 'user' || msg.role === 'assistant') {
                addMessage(msg.role, msg.content);
              }
            });
          }
        } catch (e) {
          console.warn('对话历史加载失败:', e);
          conversationHistory = [];
        }
      }

      // 清空对话
      function clearChat() {
        if (confirm('确定要清空所有对话记录吗？')) {
          conversationHistory = [];
          localStorage.removeItem('ai_conversation');
          chatMessages.innerHTML = '';
          addMessage('assistant', '对话已清空。我是智能AI助手，有什么可以帮助你的吗？✨');
        }
      }

      // 滚动到底部
      function scrollToBottom() {
        setTimeout(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
      }

      // 事件监听
      sendBtn.addEventListener('click', handleSendMessage);
      
      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
      });

      clearChatBtn.addEventListener('click', clearChat);
      saveApiKeyBtn.addEventListener('click', saveApiKey);

      // 初始化
      init();
      
      console.log('✅ 智能AI助手已启动 | 支持DeepSeek/OpenAI | 安全过滤已激活');
      console.log('💡 提示：获取DeepSeek API密钥: https://platform.deepseek.com/');
    })();
  </script>
</body>
</html>
